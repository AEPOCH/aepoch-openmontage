<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Earth and Cosmos convergence</title>
  <desc id="desc">Two semantic poles converge into a central human ring.</desc>
  <defs>
    <radialGradient id="earthHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C4835A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C4835A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cosmosHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B8A9D9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#B8A9D9" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="leftLens"><circle cx="500" cy="338" r="190"/></clipPath>
  </defs>
  <rect width="1200" height="675" fill="#FAF8F5"/>
  <circle cx="500" cy="338" r="280" fill="url(#earthHalo)"/>
  <circle cx="700" cy="338" r="280" fill="url(#cosmosHalo)"/>
  <circle cx="500" cy="338" r="190" fill="none" stroke="#C4835A" stroke-opacity="0.52" stroke-width="3"/>
  <circle cx="700" cy="338" r="190" fill="none" stroke="#B8A9D9" stroke-opacity="0.52" stroke-width="3"/>
  <circle cx="700" cy="338" r="190" fill="none" stroke="#EBC896" stroke-opacity="0.62" stroke-width="5" clip-path="url(#leftLens)"/>
  <circle cx="600" cy="338" r="82" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <text x="360" y="600" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="750" fill="#C4835A">Earth</text>
  <text x="840" y="600" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="26" font-weight="750" fill="#B8A9D9">Cosmos</text>
  <text x="600" y="82" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#1A1612">Convergence centers the human.</text>

</svg>
